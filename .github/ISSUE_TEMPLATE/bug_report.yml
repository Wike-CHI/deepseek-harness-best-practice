name: Bug Report
description: Report a problem with a plugin, preset, or example in this repository
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the sections below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Start a DSH session with ...
        2. Activate the plugin with ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH Version
      description: The DeepSeek Harness version (or commit) you are running.
      placeholder: e.g. 1.2.3
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Plugin / Preset / Example Name
      description: Which component is affected?
      placeholder: e.g. plugins/notify-hooks, presets/best-practice
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs, error messages, or diagnostics (e.g. from cordis_inspect_self). Please redact any secrets.
      render: shell
